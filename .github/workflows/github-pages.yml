name: Build and deploy Docs site to GitHub Pages

# [mishmesh] Auto-deploy disabled on this fork. This publishes upstream MeshCore
# docs to docs.meshcore.io via the gh-pages branch, which conflicts with
# deploy-mishmesh-site.yml (a repo has a single Pages source). Left manual-only;
# do not re-add the push trigger unless you switch Pages back to the gh-pages
# branch source. See deploy-mishmesh-site.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build
        run: |
          pip install mkdocs-material
          mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cname: docs.meshcore.io
          publish_dir: ./site
          publish_branch: 'gh-pages'
