[WioTrackerL1Eink]
extends = nrf52_base
board = seeed-wio-tracker-l1
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/wio-tracker-l1
  -D WIO_TRACKER_L1
  -D WIO_TRACKER_L1_EINK
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_OLED_RESET=-1
  -D EINK_DISPLAY_MODEL=GxEPD2_213_B74
  -D EINK_SCALE_X=1.953125f
  -D EINK_SCALE_Y=1.28f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=10
  -D DISPLAY_ROTATION=1
  -D DISABLE_DIAGNOSTIC_OUTPUT
  -D AUTO_OFF_MILLIS=0
  -D GPS_BAUD_RATE=9600
  -D ENV_PIN_SDA=PIN_WIRE1_SDA
  -D ENV_PIN_SCL=PIN_WIRE1_SCL
build_src_filter = ${nrf52_base.build_src_filter}
  +<WioTrackerL1Board.cpp>
  +<../variants/wio-tracker-l1>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/sensors>
lib_deps= ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit GFX Library @ ^1.12.1
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0

[env:WioTrackerL1Eink_companion_radio_ble]
extends = WioTrackerL1Eink
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${WioTrackerL1Eink.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=GxEPDDisplay
  -D UI_HAS_JOYSTICK=1
  -D PIN_BUZZER=12
  -D QSPIFLASH=1
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
  -D UI_RECENT_LIST_SIZE=6
  -D UI_SENSORS_PAGE=1
build_src_filter = ${WioTrackerL1Eink.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${WioTrackerL1Eink.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
debug_tool=stlink

[env:WioTrackerL1Eink_kiss_modem]
extends = WioTrackerL1Eink
build_src_filter = ${WioTrackerL1Eink.build_src_filter}
  +<../examples/kiss_modem/>

; The e-ink L1 shares the OLED board's sensor situation (no onboard env sensors,
; Grove port only), so it reuses that variant's build_unflags section rather than
; duplicating the list - see variants/wio-tracker-l1/platformio.ini.
[env:WioTrackerL1Eink_companion_radio_ble_mishmesh]
extends = WioTrackerL1Eink
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_unflags = ${wio_l1_mishmesh_no_grove_sensors.build_unflags}
  ; the ui-new geometry below is replaced with an integer-scale one; see build_flags
  -D EINK_SCALE_X=1.953125f
  -D EINK_SCALE_Y=1.28f
  -D EINK_Y_OFFSET=10
build_flags = ${WioTrackerL1Eink.build_flags}
  ; GxEPD2_213_B74 gives 250x122 visible at DISPLAY_ROTATION=1. Drawing into it 1:1
  ; is as sharp as this panel gets - one bitmap-font pixel is one panel pixel - and
  ; it holds four times the content of the 2x mapping. Only integer scales stay
  ; sharp, so it is this or 2x with nothing usable in between. EINK_Y_OFFSET must
  ; stay 0: the driver applies it in setCursor() but not in fillRect(), so anything
  ; else shifts text off the boxes drawn around it.
  -D EINK_LOGICAL_WIDTH=250
  -D EINK_LOGICAL_HEIGHT=122
  -D EINK_SCALE_X=1.0f
  -D EINK_SCALE_Y=1.0f
  -D EINK_Y_OFFSET=0
  -I examples/companion_radio/ui-mishmesh
  -I .
  -I mishmesh/text/mcufont
  -I mishmesh/text/fonts
  -I mishmesh/vendor/qrcode
  ; No games here: a panel refresh takes about half a second, so an arduboy title
  ; would run at 2fps. Dropping them also buys back the flash they occupied.
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=GxEPDDisplay
  -D UI_HAS_JOYSTICK=1
  -D PIN_BUZZER=12
  -D QSPIFLASH=1
  -D ADVERT_NAME='"@@MAC"'
  -D MISHMESH_FAST_FLUSH_HZ=1000000
  -D MISHMESH_NORMAL_I2C_HZ=400000
build_src_filter = ${WioTrackerL1Eink.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-mishmesh/*.cpp>
  +<../mishmesh/core/*.cpp>
  +<../mishmesh/widgets/*.cpp>
  +<../mishmesh/applets/*.cpp>
  +<../mishmesh/applets/settings/*.cpp>
  +<../mishmesh/text/Fonts.cpp>
  +<../mishmesh/text/KeyboardLayouts.cpp>
  +<../mishmesh/text/mcufont/*.c>
  +<../mishmesh/text/fonts/*.c>
  ; [mishmesh] optional local-only glyph overlay (gitignored; empty on fresh clones)
  +<../mishmesh/text/emoji-local/*.c>
  +<../mishmesh/text/emoji-local/*.cpp>
  +<../mishmesh/vendor/qrcode/*.c>
  +<../mishmesh/sound/RtttlSource.cpp>
  +<../mishmesh/sound/ScoreSource.cpp>
  +<../mishmesh/sound/ToneSequencer.cpp>
  +<../mishmesh/sound/SoundEngine.cpp>
  +<../mishmesh/sound/Sounds.cpp>
  +<../mishmesh/sound/ToneOutput_nrf52.cpp>
lib_deps = ${WioTrackerL1Eink.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

